name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  # Hard gate: a tag publishes nothing unless the full CI matrix passes on the
  # exact commit the tag points at. Reuses .github/workflows/ci.yml so the
  # release checks can never drift from the pull-request checks.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Tests and typecheck already ran in the `ci` job above, on this commit.
      - run: pnpm build

      - run: npm publish --access public

      # Pull this version's prose out of the CHANGELOG. `--notes-file` is
      # PREPENDED to `--generate-notes`, so the release reads as: hand-written
      # "what changed and why", then GitHub's auto-generated "What's Changed"
      # and "New Contributors" — which is what credits contributors by @handle
      # and PR number. If no matching section is found we fall back to the
      # generated notes alone rather than publishing an empty body.
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "NOTES_ARG=--notes-file release-notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::No CHANGELOG section found for ${TAG}; using generated notes only."
            echo "NOTES_ARG=" >> "$GITHUB_ENV"
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: gh release create "$TAG" $NOTES_ARG --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
